// Models of the Sabacc set (one class per .p3d of this folder)
//  card, token: their texture is changed by the game (hiddenSelections "camo")
//  dealer: the sensor strip turns around the visor (source "spin", driven every frame by
//          brg_game_fnc_worldTableDealer: 0 .. 1 = one turn)
class CfgSkeletons {
    class Default {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {};
    };
    class brg_dealer_skeleton: Default {
        skeletonBones[] = {"sensor", ""};
    };
};

class CfgModels {
    class Default {
        sectionsInherit = "";
        sections[] = {};
        skeletonName = "";
    };
    // Every part is a hidden selection: the models hold no paths, CfgVehicles gives the textures and materials
    class sabacc_table: Default {
        sections[] = {"camo_metal", "camo_felt", "camo_glow"};
    };
    class stool: Default {
        sections[] = {"camo_metal", "camo_cushion", "camo_glow"};
    };
    class sign: Default {
        sections[] = {"camo_metal", "camo_panel"};
    };
    class chips5: Default {
        sections[] = {"camo_top", "camo_side"};
    };
    class chip1: chips5 {};
    class die: Default {
        sections[] = {"camo_1", "camo_2", "camo_3", "camo_4", "camo_5", "camo_6"};
    };
    class card: Default {
        sections[] = {"camo"};
    };
    class token: Default {
        sections[] = {"camo"};
    };
    class dealer: Default {
        sections[] = {"camo_body", "camo_eye", "camo_lights", "camo_sensor", "camo_engine"};
        skeletonName = "brg_dealer_skeleton";
        class Animations {
            class sensor_spin {
                type = "rotation";
                source = "spin";
                selection = "sensor";
                axis = "sensor_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                angle0 = 0;
                angle1 = "rad 360";
            };
        };
    };
};
